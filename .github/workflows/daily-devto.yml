name: Daily DEV.to Article

on:
  schedule:
    # Every day at 8:00 AM IST
    # 02:30 UTC
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests google-genai

      - name: Generate and publish article
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u scripts/generate_and_publish.py

      - name: Commit topic history
        run: |
          git config user.name "devto-bot"
          git config user.email "devto-bot@users.noreply.github.com"

          git add data/topic_history.json

          git diff --cached --quiet || \
            git commit -m "chore: update DEV.to topic history"

          git push
